# A two-replica deployment. Prepare lingqu.yaml and .env as described in docs/M5.md.
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lingqu
      POSTGRES_USER: lingqu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U lingqu'], interval: 5s, timeout: 3s, retries: 10}
  migrate:
    build: .
    entrypoint: [/home/lingqu/venv/bin/flask, deploy]
    environment: &environment
      FLASK_APP: lingqu.py
      LINGQU_CONFIG: /config/lingqu.yaml
    env_file: .env
    volumes: [./lingqu.yaml:/config/lingqu.yaml:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  lingqu:
    build: .
    entrypoint: [/home/lingqu/venv/bin/gunicorn, -c, gunicorn.conf.py, 'lingqu:application']
    environment: *environment
    env_file: .env
    volumes: [./lingqu.yaml:/config/lingqu.yaml:ro]
    deploy: {replicas: 2}
    stop_grace_period: 600s
    depends_on:
      migrate: {condition: service_completed_successfully}
  gateway:
    image: nginx:1.28-alpine
    volumes: [./deploy/nginx.redis.conf:/etc/nginx/nginx.conf:ro]
    ports: ['8090:8090', '127.0.0.1:8091:8091', '127.0.0.1:8101:8101']
    depends_on: [lingqu]
volumes:
  redis-data:
  postgres-data:
