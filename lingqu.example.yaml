# lingqu.yaml: the single source of rules (DESIGN §8). Generate it from the deployment's own
# scripts; secrets are ${ENV} references and never written here.
server:
  admin_token: "${LINGQU_ADMIN_TOKEN}"
  fail_mode: open                     # open | closed (DESIGN §4.7)
  proxy_port: 8090
  status_port: 8091

storage:
  dsn: "sqlite:////data/lingqu.db"

pricing:
  source: newapi                      # newapi | ninerouter | static
  newapi: { base_url: http://new-api:3000, token: "${NEWAPI_PAT}" }
  # ninerouter: { upstream: router-team-a, password: "${ROUTER_TEAM_A_PASSWORD}" }
  # static: { claude-opus-5-5: { input: 5, output: 25 } }
  refresh: 10m
  strip_prefixes: ["cc/", "cx/", "os/cx/"]
  overrides: {}                       # model: {input, output, cache_read, cache_write_5m, cache_write_1h}

defaults:
  max_hold: 150s                      # a held request gets a 503 after this
  max_queue: 8                        # held requests per pool beyond this get a 503
  hold_cap_cached: 120s               # a held request is let through after this, whatever the ratio
  hold_cap_cold: 300s                 # session-aware pools: a request that rebuilds the cache anyway (at most max_hold)
  cache_ttl: 5m                       # prompt cache lifetime: a session idle longer than this is cold
  default_price:
    claude: { input: 5, output: 25 }
    codex:  { input: 4, output: 20 }

fifo:                                 # default release: from `at` x limit, seconds between departures
  - { at: 1.0,  gap: 15 }
  - { at: 1.25, gap: 22.5 }
  - { at: 1.5,  gap: 30 }
  - { at: 2.0,  gap: 45 }
  - { at: 2.5,  gap: 60 }

phase:                                # comparison only: seconds off / on
  - { at: 1.0,  off: 45,  on: 60 }
  - { at: 1.25, off: 75,  on: 50 }
  - { at: 1.5,  off: 100, on: 45 }
  - { at: 2.0,  off: 120, on: 45 }
  - { at: 2.5,  off: 120, on: 30 }

upstreams:                            # one per 9router instance
  - name: router-team-a
    base_url: http://router-team-a:20128
    api_key: "${ROUTER_TEAM_A_KEY}"
    # M4: enable quota polling independently of dashboard exposure (see docs/M4.md).
    # quota: { password: "${ROUTER_TEAM_A_PASSWORD}", refresh: 3m, stale_after: 6m }
    dashboard:                        # DESIGN §2.4
      port: 8101                      # or host: team-a.dash.example
      default_ttl: 30m
      max_ttl: 4h
      allow_persistent: true
      openers:                        # tokens that may open this dashboard besides the admin token
        - { name: team-a, token: "${DASH_TEAM_A_TOKEN}" }

pools:
  - name: team-a/claude
    kind: claude
    upstream: router-team-a
    keys: ["${LQ_TEAM_A_CLAUDE}"]
    # connections: ["<9router OAuth connection id>"]  # required if this provider has multiple accounts
    rules:
      # add session_aware: true once `flask replay --policy docs/replay/m3.yaml` shows it helps (DESIGN §4.5.1)
      - { kind: hourly_cap, limit: 20, on_exceed: hold, release: fifo }
      # Observe H(t) alongside the fixed cap for two weeks, then change mode to enforce.
      # short_limit must be measured for the subscription; omit it to disable the 5h eUSD constraint.
      # - { kind: hourly_budget, cycle_limit: 800, cycle_period: 7d, anchor: upstream_reset,
      #     weight_profile: workday, timezone: Asia/Shanghai, flex: 0.5,
      #     h_min: 2, h_max: 30, short_limit: 100, mode: shadow }
      # - { kind: cycle_cap, cycle_limit: 800, cycle_period: 7d, anchor: upstream_reset,
      #     on_exceed: reject, mode: shadow }
      - { kind: concurrency, max: 3, on_exceed: hold, mode: shadow }   # watch /status concurrency first
  - name: team-a/codex
    kind: codex
    upstream: router-team-a
    keys: ["${LQ_TEAM_A_CODEX}"]
    rules: []                         # metered only

notify:
  webhook: ""                         # generic JSON POST; convert to Feishu etc. on the receiving side
  throttle_events: true
  auth_streak: 2                      # account_auth / router_unreachable responses in a row before an alert

# M5: optional shared admission. All workers/replicas must use identical configuration,
# a shared PostgreSQL database, and the same SECRET_KEY for console sessions.
# redis:
#   url: "${LINGQU_REDIS_URL}"
#   namespace: lingqu-prod
#   lease: 90s
#   socket_timeout: 3s
# storage:
#   dsn: "${LINGQU_DATABASE_URL}"  # postgresql+psycopg://...
# Enable inventory/health/model/combo/usage synchronization per upstream:
# upstreams[].manager: {password: "${ROUTER_TEAM_A_PASSWORD}", refresh: 3m}

# Trusted identities; request body user/metadata are never used for authorization.
# users:
#   - name: alice
#     rules:
#       - {kind: rpm, max: 30, on_exceed: reject}
#       - {kind: concurrency, max: 2, on_exceed: hold}
#       - {kind: hourly_cap, limit: 10, on_exceed: reject}
#       - {kind: cycle_cap, cycle_limit: 200, cycle_period: 7d, anchor: "mon 00:00"}
# keys:
#   - {key: "${LQ_ALICE_CLAUDE}", pool: team-a/claude, user: alice}
#   - {key: "${LQ_ALICE_CODEX}", pool: team-a/codex, user: alice}
# Shared model keys (configure match.models on the referenced pools first):
#   - {key: "${LQ_SHARED}", upstream_pools: [team-a/claude, team-a/codex],
#      user: alice, unmatched: reject}
# Larger pool.priority wins; equal-priority matches reject rather than depending on YAML order.
# unmatched: fallback requires fallback_pool; unmatched: unknown explicitly opts into metering only.
