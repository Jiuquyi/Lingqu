<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870" width="1440" height="870" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a40"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e03131"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background (keeps the diagram readable in dark mode viewers) -->
  <rect width="1440" height="870" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="48" font-size="22" font-weight="700" fill="#212529">灵渠 Lingqu · 总体架构</text>
  <text x="30" y="72" font-size="13" fill="#868e96">New API 与 9router 之间的折算金额流控：最近 1 小时费用超限时，请求在灵渠里排队、按间隔匀速放行</text>

  <!-- ============ External: Client ============ -->
  <g filter="url(#shadow)">
    <rect x="30" y="185" width="140" height="100" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
  </g>
  <text x="100" y="222" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">客户端</text>
  <text x="100" y="244" font-size="11.5" fill="#495057" text-anchor="middle">Codex CLI</text>
  <text x="100" y="260" font-size="11.5" fill="#495057" text-anchor="middle">Claude Code / 应用</text>

  <!-- ============ External: New API ============ -->
  <g filter="url(#shadow)">
    <rect x="210" y="175" width="160" height="120" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  </g>
  <text x="290" y="208" font-size="15" font-weight="700" fill="#5f3dc4" text-anchor="middle">New API</text>
  <text x="290" y="230" font-size="11.5" fill="#495057" text-anchor="middle">用户 · 令牌 · 计费</text>
  <text x="290" y="248" font-size="11.5" fill="#495057" text-anchor="middle">每池一个渠道</text>
  <text x="290" y="264" font-size="11.5" fill="#495057" text-anchor="middle">Base URL → 灵渠 :8090</text>
  <text x="290" y="282" font-size="10.5" fill="#868e96" text-anchor="middle">:3000 · 对外</text>

  <!-- ============ External: browser for the dashboard gate ============ -->
  <g filter="url(#shadow)">
    <rect x="30" y="640" width="340" height="72" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
  </g>
  <text x="200" y="670" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">管理员 / 组内用户（浏览器）</text>
  <text x="200" y="692" font-size="11.5" fill="#495057" text-anchor="middle">admin token 或本组 opener token</text>

  <!-- ============ Lingqu container ============ -->
  <rect x="400" y="92" width="620" height="712" rx="14" fill="#f5f7fb" stroke="#3b5bdb" stroke-width="2"/>
  <text x="420" y="124" font-size="19" font-weight="700" fill="#3b5bdb">灵渠 Lingqu</text>
  <text x="1000" y="124" font-size="12" fill="#5c7cfa" text-anchor="end">代理 :8090 · 状态 :8091 · Dashboard 入口 :8101…</text>

  <!-- data plane panel -->
  <rect x="415" y="140" width="590" height="225" rx="10" fill="#ffffff" stroke="#c5cee0" stroke-width="1"/>
  <text x="430" y="163" font-size="12.5" font-weight="600" fill="#495057">数据面 · 每个请求</text>

  <!-- pipeline stages: x = 430 + 94*i, w=84, y 195..275 -->
  <g font-size="13" text-anchor="middle">
    <rect x="430" y="195" width="84" height="80" rx="8" fill="#e7edff" stroke="#3b5bdb" stroke-width="1.3"/>
    <text x="472" y="228" font-weight="700" fill="#364fc7">① 鉴权</text>
    <text x="472" y="249" font-size="10.5" fill="#495057">lq- key → 池</text>

    <rect x="524" y="195" width="84" height="80" rx="8" fill="#e7edff" stroke="#3b5bdb" stroke-width="1.3"/>
    <text x="566" y="222" font-weight="700" fill="#364fc7">② 解析</text>
    <text x="566" y="242" font-size="10.5" fill="#495057">协议 · 模型</text>
    <text x="566" y="258" font-size="10.5" fill="#495057">会话</text>

    <rect x="618" y="195" width="84" height="80" rx="8" fill="#e7edff" stroke="#3b5bdb" stroke-width="1.3"/>
    <text x="660" y="228" font-weight="700" fill="#364fc7">③ 计价</text>
    <text x="660" y="249" font-size="10.5" fill="#495057">同步的价格表</text>

    <rect x="712" y="195" width="84" height="80" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.8"/>
    <text x="754" y="222" font-weight="700" fill="#d9480f">④ 闸门</text>
    <text x="754" y="242" font-size="10.5" fill="#495057">1h 滚动费用</text>
    <text x="754" y="258" font-size="10.5" fill="#495057">FIFO 匀速</text>

    <rect x="806" y="195" width="84" height="80" rx="8" fill="#e7edff" stroke="#3b5bdb" stroke-width="1.3"/>
    <text x="848" y="222" font-weight="700" fill="#364fc7">⑤ 转发</text>
    <text x="848" y="242" font-size="10.5" fill="#495057">只换 key</text>
    <text x="848" y="258" font-size="10.5" fill="#495057">SSE 逐块透传</text>

    <rect x="900" y="195" width="84" height="80" rx="8" fill="#e7edff" stroke="#3b5bdb" stroke-width="1.3"/>
    <text x="942" y="222" font-weight="700" fill="#364fc7">⑥ 计入</text>
    <text x="942" y="242" font-size="10.5" fill="#495057">message_start</text>
    <text x="942" y="258" font-size="10.5" fill="#495057">即计入输入</text>
  </g>

  <!-- hold branch -->
  <rect x="690" y="310" width="128" height="40" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="1.3"/>
  <text x="754" y="335" font-size="11.5" fill="#c92a2a" text-anchor="middle">排队 · 等不了才 503</text>
  <line x1="754" y1="275" x2="754" y2="308" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>

  <!-- control plane panel -->
  <rect x="415" y="380" width="590" height="235" rx="10" fill="#ffffff" stroke="#c5cee0" stroke-width="1"/>
  <text x="430" y="403" font-size="12.5" font-weight="600" fill="#495057">控制面 · 后台线程</text>

  <!-- row 1: x 430/620/810, w170, y 420..500 -->
  <g text-anchor="middle">
    <rect x="430" y="420" width="170" height="80" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.3"/>
    <text x="515" y="446" font-size="13" font-weight="700" fill="#d9480f">价格同步</text>
    <text x="515" y="466" font-size="10.5" fill="#495057">每 10 分钟 · 失败沿用上次</text>
    <text x="515" y="482" font-size="10.5" fill="#495057">快照兜底</text>

    <rect x="620" y="420" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="705" y="446" font-size="13" font-weight="700" fill="#868e96">小时预算 · 额度采集</text>
    <text x="705" y="466" font-size="10.5" fill="#868e96">9router used% · reset</text>
    <text x="705" y="482" font-size="10.5" fill="#868e96">第三版</text>

    <rect x="810" y="420" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.3"/>
    <text x="895" y="446" font-size="13" font-weight="700" fill="#343a40">账本 Ledger</text>
    <text x="895" y="466" font-size="10.5" fill="#495057">请求明细 · 限速事件</text>
    <text x="895" y="482" font-size="10.5" fill="#495057">重启时恢复 1h 窗口</text>
  </g>

  <!-- row 2: y 520..600 -->
  <g text-anchor="middle">
    <rect x="430" y="520" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.3"/>
    <text x="515" y="546" font-size="13" font-weight="700" fill="#343a40">配置 · 校验</text>
    <text x="515" y="566" font-size="10.5" fill="#495057">YAML 单一来源 · 热重载</text>
    <text x="515" y="582" font-size="10.5" fill="#495057">flask check · replay</text>

    <rect x="620" y="520" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.3"/>
    <text x="705" y="546" font-size="13" font-weight="700" fill="#343a40">观测 · 告警</text>
    <text x="705" y="566" font-size="10.5" fill="#495057">/status · /stats · /events</text>
    <text x="705" y="582" font-size="10.5" fill="#495057">webhook</text>

    <rect x="810" y="520" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="895" y="546" font-size="13" font-weight="700" fill="#868e96">9router 管理器</text>
    <text x="895" y="566" font-size="10.5" fill="#868e96">健康 · 账号 · 对账</text>
    <text x="895" y="582" font-size="10.5" fill="#868e96">推后（M5）</text>
  </g>

  <!-- dashboard gate panel -->
  <rect x="415" y="630" width="590" height="92" rx="10" fill="#ffffff" stroke="#c5cee0" stroke-width="1"/>
  <text x="430" y="652" font-size="12.5" font-weight="600" fill="#495057">9router Dashboard 入口</text>
  <g text-anchor="middle">
    <rect x="430" y="662" width="170" height="48" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.3"/>
    <text x="515" y="682" font-size="12.5" font-weight="700" fill="#2b8a3e">开关页 /dashboards</text>
    <text x="515" y="700" font-size="10.5" fill="#495057">:8091 · 审计每次开关</text>

    <rect x="650" y="662" width="330" height="48" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.3"/>
    <text x="815" y="682" font-size="12.5" font-weight="700" fill="#2b8a3e">入口端口 :8101 / :8102 …（每个 9router 一个）</text>
    <text x="815" y="700" font-size="10.5" fill="#495057">默认关闭 · 临时（到期自动关）/ 保持打开 · LLM 路径一律 404</text>
  </g>
  <line x1="600" y1="686" x2="647" y2="686" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
  <text x="624" y="679" font-size="10" fill="#2b8a3e" text-anchor="middle">开 / 关</text>

  <!-- runtime -->
  <rect x="415" y="736" width="590" height="52" rx="10" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
  <text x="710" y="767" font-size="12.5" fill="#343a40" text-anchor="middle">Flask + gunicorn（1 进程 × N 线程，按端口分流）· SQLite / PostgreSQL · 内存滑动窗口</text>

  <!-- ============ External: 9router instances ============ -->
  <g filter="url(#shadow)">
    <rect x="1076" y="181" width="170" height="140" rx="10" fill="#f4fbf5" stroke="#8ce99a" stroke-width="1.2"/>
    <rect x="1068" y="173" width="170" height="140" rx="10" fill="#f0faf2" stroke="#69db7c" stroke-width="1.2"/>
    <rect x="1060" y="165" width="170" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  </g>
  <text x="1145" y="196" font-size="15" font-weight="700" fill="#2b8a3e" text-anchor="middle">9router × N</text>
  <text x="1145" y="216" font-size="11.5" fill="#495057" text-anchor="middle">每组一个实例</text>
  <text x="1145" y="236" font-size="11.5" fill="#495057" text-anchor="middle">:20128 · 只放行灵渠</text>
  <text x="1145" y="254" font-size="11.5" fill="#495057" text-anchor="middle">requireApiKey</text>
  <text x="1145" y="272" font-size="11.5" fill="#495057" text-anchor="middle">OAuth 账号 · combo</text>

  <!-- ============ Upstream subscriptions ============ -->
  <g filter="url(#shadow)">
    <rect x="1290" y="150" width="130" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
    <rect x="1290" y="250" width="130" height="70" rx="10" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  </g>
  <text x="1355" y="181" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">Codex</text>
  <text x="1355" y="202" font-size="11" fill="#495057" text-anchor="middle">ChatGPT 订阅</text>
  <text x="1355" y="281" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">Claude</text>
  <text x="1355" y="302" font-size="11" fill="#495057" text-anchor="middle">Claude 订阅</text>

  <!-- ============ Main request flow (solid) ============ -->
  <g stroke="#343a40" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <line x1="170" y1="235" x2="207" y2="235"/>
    <line x1="370" y1="235" x2="427" y2="235"/>
    <line x1="514" y1="235" x2="522" y2="235"/>
    <line x1="608" y1="235" x2="616" y2="235"/>
    <line x1="702" y1="235" x2="710" y2="235"/>
    <line x1="796" y1="235" x2="804" y2="235"/>
    <line x1="890" y1="235" x2="898" y2="235"/>
    <line x1="984" y1="235" x2="1057" y2="235"/>
    <path d="M1246 215 L1287 188"/>
    <path d="M1246 265 L1287 282"/>
  </g>
  <text x="1022" y="226" font-size="10.5" fill="#495057" text-anchor="middle">内网</text>

  <!-- ============ Control / feedback flows (dashed) ============ -->
  <!-- New API pricing -> price sync -->
  <path d="M290 295 V460 H427" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrOrange)"/>
  <text x="298" y="388" font-size="11" fill="#d9480f">价格 /api/pricing</text>
  <text x="298" y="404" font-size="11" fill="#d9480f">个人令牌 · 只读</text>

  <!-- price -> gate -->
  <path d="M515 420 V292 H732 V278" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrOrange)"/>
  <text x="522" y="345" font-size="11" fill="#d9480f">价格 · 限额 → 闸门</text>

  <!-- quota collector -> budget calculator (third version) -->
  <line x1="620" y1="460" x2="603" y2="460" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- proxy -> quota collector (response headers, third version) -->
  <path d="M848 275 V395 H730 V417" fill="none" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrBlue)"/>
  <text x="856" y="300" font-size="10.5" fill="#3b5bdb">usage / 响应头</text>

  <!-- settle -> ledger -->
  <line x1="942" y1="275" x2="942" y2="417" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrBlue)"/>
  <text x="948" y="340" font-size="10.5" fill="#3b5bdb">eUSD 入账</text>

  <!-- ledger -> budget (used) : drawn along row1 bottom -->
  <path d="M895 500 V510 H515 V503" fill="none" stroke="#868e96" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arr)"/>

  <!-- browser -> toggle page, browser -> gate port -->
  <line x1="370" y1="676" x2="427" y2="676" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
  <path d="M200 712 V728 H815 V713" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
  <text x="210" y="746" font-size="10.5" fill="#2b8a3e">打开后进 Dashboard</text>

  <!-- gate port -> 9router dashboard -->
  <path d="M980 686 H1153 V324" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
  <text x="1161" y="470" font-size="11" fill="#2b8a3e">只转发 Dashboard</text>
  <text x="1161" y="486" font-size="11" fill="#2b8a3e">（/dashboard、/api/*）</text>
  <text x="1161" y="502" font-size="11" fill="#2b8a3e">连接 / 重新授权账户</text>

  <!-- ============ Legend ============ -->
  <g font-size="12" fill="#495057">
    <line x1="30" y1="840" x2="70" y2="840" stroke="#343a40" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="80" y="844">请求流</text>
    <line x1="150" y1="840" x2="190" y2="840" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrBlue)"/>
    <text x="200" y="844">用量回流</text>
    <line x1="290" y1="840" x2="330" y2="840" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrOrange)"/>
    <text x="340" y="844">价格 · 流控决策</text>
    <line x1="460" y1="840" x2="500" y2="840" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
    <text x="510" y="844">Dashboard 入口</text>
    <rect x="630" y="831" width="34" height="18" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="674" y="844">后续版本</text>
    <text x="1410" y="844" text-anchor="end" fill="#adb5bd">eUSD = 按公开 API 价格折算的等价美元</text>
  </g>
</svg>
