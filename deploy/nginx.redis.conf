events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=5s;
    upstream lingqu_proxy { zone proxy 64k; server lingqu:8090 resolve; }
    upstream lingqu_admin { zone admin 64k; server lingqu:8091 resolve; }
    upstream lingqu_dashboard { zone dashboard 64k; server lingqu:8101 resolve; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream off;
    client_max_body_size 128m;
    server { listen 8090; location / { proxy_pass http://lingqu_proxy; } }
    server { listen 8091; location / { proxy_pass http://lingqu_admin; } }
    server { listen 8101; location / { proxy_pass http://lingqu_dashboard; } }
}
