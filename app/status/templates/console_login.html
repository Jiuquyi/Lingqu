{% extends 'console_base.html' %}{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-3">管理员登录</h1><p class="text-secondary">输入配置中的管理员 token。</p>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="token" class="form-label">管理员 token</label><input id="token" class="form-control mb-3" type="password" name="token" autocomplete="current-password" required><button class="btn btn-primary w-100">登录</button></form></div></div></div></div>{% endblock %}
